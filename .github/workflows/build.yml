name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unzip project
        run: unzip -oq project.zip -d proj

      - name: Build template APK
        working-directory: proj
        run: gradle :template:assembleRelease --stacktrace

      - name: Put template into app
        run: |
          mkdir -p proj/app/src/main/assets
          cp proj/template/build/outputs/apk/release/*.apk proj/app/src/main/assets/template.apk

      - name: Build HTML to APK app
        working-directory: proj
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename
        run: cp proj/app/build/outputs/apk/release/app-release.apk HTML-to-APK.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HTML to APK v${{ github.run_number }}
          files: HTML-to-APK.apk
